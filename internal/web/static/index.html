<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WzItemArchive · 物品元数据检索</title>
<style>
  :root { --bd:#e3e6ea; --fg:#20232a; --mut:#6b7280; --acc:#2563eb; --bg:#f6f7f9; --side:288px; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; color:var(--fg); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--bd); padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           position:sticky; top:0; z-index:20; }
  header h1 { font-size:17px; margin:0; }
  header .stat { color:var(--mut); font-size:12px; flex:1 1 320px; }
  .layout { display:flex; align-items:flex-start; gap:16px; max-width:1440px; margin:16px auto 40px; padding:0 16px; }
  aside { width:var(--side); flex:0 0 var(--side); position:sticky; top:66px; max-height:calc(100vh - 82px); overflow:auto;
          background:#fff; border:1px solid var(--bd); border-radius:8px; padding:12px; }
  aside h3 { font-size:12px; color:var(--mut); margin:14px 0 6px; text-transform:none; letter-spacing:.2px; }
  aside h3:first-child { margin-top:0; }
  section.content { flex:1 1 auto; min-width:0; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:12px; }
  form.bar { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut); }
  input,select,button { font:inherit; padding:6px 9px; border:1px solid var(--bd); border-radius:6px; background:#fff; color:var(--fg); }
  input:focus,select:focus { outline:2px solid #bfdbfe; border-color:var(--acc); }
  #q { width:260px; }
  button { cursor:pointer; background:var(--acc); color:#fff; border-color:var(--acc); }
  button.ghost { background:#fff; color:var(--fg); border-color:var(--bd); }
  button.mini { padding:2px 7px; font-size:12px; background:#fff; color:var(--mut); border-color:var(--bd); }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th,td { padding:7px 9px; border-bottom:1px solid var(--bd); text-align:left; vertical-align:middle; }
  th { font-size:12px; color:var(--mut); font-weight:600; background:#fafbfc; position:sticky; top:0; }
  tbody tr:hover { background:#f0f6ff; cursor:pointer; }
  td.id { font-family:Consolas,monospace; white-space:nowrap; }
  td.img { width:44px; text-align:center; }
  td.img img { width:34px; height:34px; image-rendering:pixelated; vertical-align:middle; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#eef2ff; color:#3730a3; }
  .miss { color:#b91c1c; }
  .pager { display:flex; gap:10px; align-items:center; justify-content:flex-end; margin-top:10px; color:var(--mut); font-size:12px; }
  .empty { padding:26px; text-align:center; color:var(--mut); }
  /* 侧边栏：分类清单 */
  .catlist { max-height:290px; overflow:auto; border:1px solid var(--bd); border-radius:6px; }
  .cat { display:flex; justify-content:space-between; gap:6px; padding:5px 8px; font-size:13px; cursor:pointer; border-bottom:1px solid #f1f2f4; }
  .cat:last-child { border-bottom:none; }
  .cat:hover { background:#f0f6ff; }
  .cat.on { background:#e5edff; color:#1d4ed8; font-weight:600; }
  .cat .n { color:var(--mut); font-family:Consolas,monospace; font-size:12px; }
  .cat.on .n { color:#1d4ed8; }
  /* 侧边栏：条件行 */
  .cond { display:grid; grid-template-columns:1fr 62px; gap:4px; margin-bottom:6px; padding:6px; border:1px dashed var(--bd); border-radius:6px; }
  .cond .r1 { display:flex; gap:4px; }
  .cond input.k { width:100%; min-width:0; }
  .cond .v { grid-column:1 / 3; display:flex; gap:4px; }
  .cond select.op { width:76px; flex:0 0 76px; padding:4px 6px; }
  .cond input.val { flex:1 1 auto; min-width:0; padding:4px 6px; }
  .cond .hint { grid-column:1 / 3; font-size:11px; color:var(--mut); }
  .presets { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .presets button { background:#f3f4f6; color:#374151; border-color:var(--bd); font-size:11px; padding:2px 7px; }
  /* 详情浮动层 */
  #mask { position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; z-index:50; }
  #mask.on { display:block; }
  #modal { position:fixed; right:24px; top:76px; width:min(520px, calc(100vw - 48px)); max-height:calc(100vh - 110px);
           overflow:auto; background:#fff; border:1px solid var(--bd); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.22);
           padding:14px 16px; z-index:51; display:none; }
  #modal.on { display:block; }
  #modal .x { position:sticky; top:0; float:right; margin:-6px -6px 0 0; background:#fff; color:var(--mut);
              border:1px solid var(--bd); border-radius:6px; width:26px; height:26px; line-height:1; padding:0; font-size:16px; }
  #modal .head { display:flex; gap:12px; align-items:flex-start; clear:none; }
  #modal .head img { width:64px; height:64px; image-rendering:pixelated; border:1px solid var(--bd); border-radius:6px; flex:0 0 64px;
                     background:repeating-conic-gradient(#f3f4f6 0% 25%, #fff 0% 50%) 50%/12px 12px; }
  #modal h2 { font-size:15px; margin:0 0 6px; }
  dl.info { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; margin:10px 0 0; font-size:12px; font-family:Consolas,monospace; }
  dl.info div { display:contents; }
  dl.info dt { color:var(--mut); }
  dl.info dd { margin:0; word-break:break-all; }
  .desc { white-space:pre-wrap; color:#374151; margin:0 0 4px; font-size:13px; }
  details.noise { margin-top:10px; font-size:12px; color:var(--mut); }
  details.noise summary { cursor:pointer; }
  @media (max-width: 860px) { .layout { flex-direction:column; } aside { width:auto; flex:none; position:static; max-height:none; } }
</style>
</head>
<body>
<header>
  <h1>WzItemArchive 物品检索</h1>
  <label style="font-size:12px">语言
    <select id="lang"></select>
  </label>
  <div class="stat" id="stat">正在读取统计…</div>
</header>

<div class="layout">
  <aside>
    <h3>分类</h3>
    <input id="catSearch" placeholder="筛选分类…" style="width:100%;margin-bottom:6px">
    <div class="catlist" id="catList"></div>

    <h3>数据完整度</h3>
    <select id="complete" style="width:100%">
      <option value="">不限</option>
      <option value="all">名称+属性齐全</option>
      <option value="named">仅有名称</option>
      <option value="info">仅有属性（缺名称）</option>
    </select>

    <h3>属性条件</h3>
    <div class="presets" id="presets"></div>
    <div id="conds"></div>
    <button type="button" class="ghost" id="addCond" style="width:100%">＋ 添加条件</button>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">
      属性键可以直接手输，未收录的键按原名查询；条件之间是「且」。
    </div>

    <h3>排序</h3>
    <div style="display:flex;gap:6px">
      <select id="order" style="flex:1">
        <option value="id">按 ID</option>
        <option value="name">按名称</option>
        <option value="category">按分类</option>
      </select>
      <select id="desc" style="width:78px">
        <option value="">升序</option>
        <option value="1">降序</option>
      </select>
    </div>
  </aside>

  <section class="content">
    <div class="card">
      <form class="bar" id="f">
        <label>关键字
          <input id="q" placeholder="名称模糊匹配；纯数字按 ID 前缀">
        </label>
        <label>每页
          <select id="limit"><option>20</option><option selected>50</option><option>100</option><option>200</option></select>
        </label>
        <button type="submit">查询</button>
        <button type="button" class="ghost" id="reset">重置</button>
      </form>
    </div>

    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">填写条件后点“查询”。</td></tr></tbody>
    </table>
    <div class="pager">
      <button class="ghost" id="prev">上一页</button>
      <span id="page">-</span>
      <button class="ghost" id="next">下一页</button>
    </div>
  </section>
</div>

<div id="mask"></div>
<div id="modal" role="dialog" aria-modal="true" aria-label="物品详情">
  <button class="x" id="closeModal" title="关闭（Esc）">×</button>
  <div id="modalBody"></div>
</div>
<datalist id="attrKeys"></datalist>

<script>
let offset = 0, total = 0, iconsOn = false;
let meta = { categories: [], attrs: [] };   // 来自 /api/meta
let conds = [];                              // {key, op, val}
let catSel = '';                             // 选中分类

function val(id) { return document.getElementById(id).value; }
function lang() { return val('lang'); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// WZ 里的描述常把换行写成字面量反斜杠+n，展示前还原成真换行（.desc 已设 white-space:pre-wrap）。
function nl(s) { return String(s).replace(/\\r\\n|\\n|\\r/g, '\n'); }
const attrMap = () => Object.fromEntries(meta.attrs.map(a => [a.key, a]));

function collectParams() {
  const p = new URLSearchParams();
  const q = val('q').trim();
  if (q) p.set('q', q);
  if (catSel) p.set('cat', catSel);
  if (val('complete')) p.set('complete', val('complete'));
  for (const c of conds) {
    const k = (c.key || '').trim();
    if (!k) continue;
    const v = (c.val || '').trim();
    if (c.op === 'has') { p.append('has', k); continue; }
    if (!v) continue;
    if (c.op === 'eq') p.append('attr', k + '=' + v);
    else if (c.op === 'like') p.append('like', k + '=' + v);
    else if (c.op === 'gte') p.append('min', k + '=' + v);
    else if (c.op === 'lte') p.append('max', k + '=' + v);
  }
  if (val('order') !== 'id') p.set('order', val('order'));
  if (val('desc')) p.set('desc', '1');
  p.set('limit', val('limit') || 50);
  p.set('offset', offset);
  p.set('lang', lang());
  return p;
}

async function run() {
  const r = await fetch('/api/items?' + collectParams().toString());
  if (!r.ok) { alert(await r.text()); return; }
  const data = await r.json();
  total = data.total;
  render(data.items, data.total);
}

function head() {
  return '<th style="width:96px">ID</th>' + (iconsOn ? '<th style="width:44px"></th>' : '') +
         '<th style="width:180px">名称</th><th style="width:120px">分类</th><th>关键属性</th><th style="width:64px">状态</th>';
}

function render(items, n) {
  document.getElementById('thead').innerHTML = head();
  const tb = document.getElementById('rows');
  if (!items.length) {
    tb.innerHTML = `<tr><td colspan="${iconsOn ? 6 : 5}" class="empty">没有命中，共 ${n} 条。</td></tr>`;
  } else {
    tb.innerHTML = items.map(it => `<tr data-id="${it.id}">
      <td class="id">${it.id}</td>
      ${iconsOn ? `<td class="img">${it.icon ? `<img src="${it.icon}" loading="lazy" alt="">` : ''}</td>` : ''}
      <td>${it.name ? esc(it.name) : '<span class="miss">（缺名称）</span>'}</td>
      <td>${it.category ? `<span class="tag" title="${esc(it.category)}">${esc(catText(it.category))}</span>` : '-'}</td>
      <td class="id">${chips(it.info)}</td>
      <td>${it.hasName && it.hasInfo ? '完整' : (it.hasName ? '仅名称' : '仅属性')}</td>
    </tr>`).join('');
  }
  document.getElementById('page').textContent =
    n ? `第 ${offset + 1} - ${Math.min(offset + items.length, n)} 条 / 共 ${n} 条` : '共 0 条';
}

function catText(name) {
  const c = meta.categories.find(x => x.name === name);
  return c && c.label ? `${c.label}（${name}）` : name;
}
function attrText(key) {
  const a = attrMap()[key];
  return a && a.label ? a.label : key;
}

function chips(info) {
  const m = attrMap();
  const ks = Object.keys(info).filter(k => m[k] && m[k].preset);
  const rest = Object.keys(info).filter(k => !(m[k] && m[k].preset));
  let s = ks.map(k => `<span class="tag" title="${esc(k)}">${esc(attrText(k))}=${esc(info[k])}</span>`).join(' ');
  if (rest.length) s += ` <span style="color:#6b7280">…另 ${rest.length} 项</span>`;
  return s || '<span style="color:#6b7280">无 info</span>';
}

// —— 侧边栏：分类 ——
function catLabel(c) {
  // 全部分类、未分类这类哨兵项不再套「中文（英文）」格式。
  if (!c.name || c.name === meta.uncategorized) return c.label || c.name || '全部分类';
  return c.label ? `${c.label}（${c.name}）` : c.name;
}

function renderCats() {
  const kw = val('catSearch').trim().toLowerCase();
  const list = meta.categories.filter(c =>
    !kw || c.name.toLowerCase().includes(kw) || (c.label || '').toLowerCase().includes(kw));
  const rows = [{ name: '', label: '全部分类', count: null }].concat(list);
  document.getElementById('catList').innerHTML = rows.map(c => `
    <div class="cat${c.name === catSel ? ' on' : ''}" data-cat="${esc(c.name)}">
      <span>${esc(catLabel(c))}</span>
      <span class="n">${c.count === null ? '' : c.count}</span>
    </div>`).join('');
}

// —— 侧边栏：属性条件 ——
function renderConds() {
  const box = document.getElementById('conds');
  box.innerHTML = conds.map((c, i) => `
    <div class="cond" data-i="${i}">
      <div class="r1">
        <input class="k" list="attrKeys" placeholder="属性键" value="${esc(c.key)}" data-i="${i}">
        <button class="mini rm" title="删除该条件" data-i="${i}">×</button>
      </div>
      <div class="v">
        <select class="op" data-i="${i}">
          <option value="eq"${c.op === 'eq' ? ' selected' : ''}>等于</option>
          <option value="like"${c.op === 'like' ? ' selected' : ''}>包含</option>
          <option value="gte"${c.op === 'gte' ? ' selected' : ''}>≥</option>
          <option value="lte"${c.op === 'lte' ? ' selected' : ''}>≤</option>
          <option value="has"${c.op === 'has' ? ' selected' : ''}>存在</option>
        </select>
        <input class="val" placeholder="值" value="${esc(c.val)}" data-i="${i}"${c.op === 'has' ? ' disabled' : ''}>
      </div>
      <div class="hint">${c.key ? esc(attrText(c.key)) : ''}</div>
    </div>`).join('');
}

function renderPresets() {
  const ps = meta.attrs.filter(a => a.preset);
  document.getElementById('presets').innerHTML =
    ps.map(a => `<button type="button" class="add" data-key="${esc(a.key)}" title="${esc(a.key)}，库内 ${a.count} 条">${esc(a.label)}</button>`).join('');
  document.getElementById('attrKeys').innerHTML =
    meta.attrs.map(a => `<option value="${esc(a.key)}">${esc(a.label || a.key)}（${a.count}）</option>`).join('');
}

async function loadMeta() {
  const r = await fetch('/api/meta?lang=' + encodeURIComponent(lang()));
  if (!r.ok) { alert(await r.text()); return; }
  meta = await r.json();
  renderCats();
  renderPresets();
  renderConds();
}

async function loadStats() {
  const s = await (await fetch('/api/stats?lang=' + encodeURIComponent(lang()))).json();
  iconsOn = !!s.iconsOn;
  document.getElementById('stat').textContent =
    `物品 ${s.items} 条 ｜ 有名称 ${s.named} ｜ 有属性 ${s.withInfo} ｜ 两者齐全 ${s.complete} ｜ 已扫文件 ${s.files}（失败 ${s.failed}）` +
    (s.lastRunUnix ? ` ｜ 上次扫描 ${new Date(s.lastRunUnix * 1000).toLocaleString('zh-CN')}` : '');
}

// —— 详情浮动层 ——
// 图标尺寸、锚点坐标这类渲染附属字段，对检索没意义，详情里折叠起来。
const NOISE_KEY = /(^icon|^image|^sample|^origin|^lt\.|^rb\.|^bodyRelMove|\.origin\.|\.width$|\.height$|\.format$|\.scale$|\.x$|\.y$|\.top$|\.center$)/;

async function detail(id) {
  const r = await fetch(`/api/item?id=${encodeURIComponent(id)}&lang=${encodeURIComponent(lang())}`);
  const body = document.getElementById('modalBody');
  openModal();
  if (!r.ok) { body.innerHTML = `<div class="desc">${esc(await r.text())}</div>`; return; }
  const it = await r.json();
  const ks = Object.keys(it.info).sort();
  const main = ks.filter(k => !NOISE_KEY.test(k));
  const noise = ks.filter(k => NOISE_KEY.test(k));
  const dt = k => `<div><dt title="${esc(k)}">${esc(attrText(k))}</dt><dd>${esc(it.info[k])}</dd></div>`;
  const rows = main.map(dt).join('');
  const extra = noise.length
    ? `<details class="noise"><summary>图标与坐标等内部字段（${noise.length}）</summary><dl class="info">${noise.map(dt).join('')}</dl></details>`
    : '';
  body.innerHTML = `<div class="head">
      ${it.icon ? `<img src="${it.icon}" alt="">` : ''}
      <div style="flex:1;min-width:0">
        <h2>${it.id} · ${esc(it.name || '（缺名称）')}</h2>
        <div style="margin-bottom:6px">
          <span class="tag">${it.category ? esc(catText(it.category)) : '未分类'}</span>
          <span class="tag">${esc(it.lang)}</span>
        </div>
        <p class="desc">${esc(nl(it.descr || ''))}</p>
        <div class="stat">更新 ${esc(it.updatedAt)} ｜ 名称${it.hasName ? '有' : '缺'} ｜ 属性${it.hasInfo ? '有' : '缺'}</div>
      </div>
    </div>
    <dl class="info">${rows || '<div><dt>-</dt><dd>该物品没有 info 节点</dd></div>'}</dl>${extra}`;
}
function openModal() {
  document.getElementById('mask').classList.add('on');
  document.getElementById('modal').classList.add('on');
}
function closeModal() {
  document.getElementById('mask').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}

async function refreshAll() {
  offset = 0;
  await loadMeta();
  await loadStats();
  await run();
}

// —— 事件 ——
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); offset = 0; run(); });
document.getElementById('reset').addEventListener('click', () => {
  document.getElementById('q').value = '';
  document.getElementById('complete').value = '';
  document.getElementById('order').value = 'id';
  document.getElementById('desc').value = '';
  conds = []; catSel = '';
  offset = 0; renderCats(); renderConds(); run();
});
document.getElementById('lang').addEventListener('change', refreshAll);
document.getElementById('catSearch').addEventListener('input', renderCats);
document.getElementById('catList').addEventListener('click', e => {
  const el = e.target.closest('.cat');
  if (!el) return;
  catSel = el.dataset.cat;
  offset = 0; renderCats(); run();
});
document.getElementById('addCond').addEventListener('click', () => { conds.push({ key: '', op: 'eq', val: '' }); renderConds(); });
document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('button.add');
  if (!b) return;
  conds.push({ key: b.dataset.key, op: 'eq', val: '' });
  renderConds();
});
document.getElementById('conds').addEventListener('input', e => {
  const i = +e.target.dataset.i;
  if (isNaN(i)) return;
  if (e.target.classList.contains('k')) {
    conds[i].key = e.target.value;
    const h = e.target.closest('.cond').querySelector('.hint');
    h.textContent = e.target.value ? attrText(e.target.value.trim()) : '';
  } else if (e.target.classList.contains('val')) {
    conds[i].val = e.target.value;
  }
});
document.getElementById('conds').addEventListener('change', e => {
  const i = +e.target.dataset.i;
  if (isNaN(i)) return;
  if (e.target.classList.contains('op')) {
    conds[i].op = e.target.value;
    renderConds();
  }
});
document.getElementById('conds').addEventListener('click', e => {
  if (!e.target.classList.contains('rm')) return;
  conds.splice(+e.target.dataset.i, 1);
  renderConds();
});
document.getElementById('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) detail(tr.dataset.id);
});
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('mask').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('prev').addEventListener('click', () => { offset = Math.max(0, offset - (+val('limit'))); run(); });
document.getElementById('next').addEventListener('click', () => { if (offset + (+val('limit')) < total) { offset += +val('limit'); run(); } });

(async () => {
  const data = await (await fetch('/api/langs')).json();
  const sel = document.getElementById('lang');
  sel.innerHTML = data.langs.map(l => `<option value="${esc(l.lang)}">${esc(l.label)} (${l.items})</option>`).join('');
  sel.value = data.default;
  await refreshAll();
})();
</script>
</body>
</html>
